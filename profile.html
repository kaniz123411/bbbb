
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCore - Patient Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>MediCore</h1>
            <p>Hospital Management System</p>
        </div>

        <div class="form-container">

            <h2>My Profile</h2>
            <p class="subtitle">Patient Personal Information</p>

            <div class="profile-details">

                <p><strong>Full Name:</strong> <span id="profileName">Not available</span></p>

                <p><strong>Email:</strong> <span id="profileEmail">Not available</span></p>

                <p><strong>Phone:</strong> <span id="profilePhone">Not available</span></p>

                <p><strong>Date of Birth:</strong> <span id="profileDob">Not available</span></p>

                <p><strong>Gender:</strong> <span id="profileGender">Not available</span></p>

                <p><strong>Address:</strong> <span id="profileAddress">Not available</span></p>

            </div>

            <button onclick="goDashboard()">Back to Dashboard</button>

        </div>

        <footer>
            © 2026 MediCore Hospital Management System
        </footer>

    </div>

    <script src="profile.js"></script>
</body>
</html>
